[package]
productName = "omniweather"
version = "0.1.0"
edition = "2021"

[lib]
name = "omniweather_lib"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "*" , features = ["derive"] }
serde_json = "*"